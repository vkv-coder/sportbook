<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Mahjong SportBook</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#EAF4EA" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF4EA;--surface:#F5FAF6;--card:#FFFFFF;--border:#D7E8DA;--gold:#2E9E60;--gold-light:#3FBE79;--red:#c0392b;--green:#27ae60;--blue:#2980b9;--text:#1B4D2E;--muted:#5B6B5B;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-family:'Noto Serif Display',serif;font-size:18px;color:var(--gold);}
.header-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.main{max-width:480px;margin:0 auto;padding:20px 16px 80px;}
.club-selector{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;}
.club-selector label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.club-selector select{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;outline:none;}
.club-selector select:focus{border-color:var(--gold);}
select option{background:var(--surface);}
.loading{text-align:center;padding:32px;color:var(--muted);font-size:13px;}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .empty-icon{font-size:40px;margin-bottom:12px;}
.empty-state p{font-size:13px;line-height:1.6;}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.stat-number{font-size:22px;font-weight:700;color:var(--gold);}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:28px;padding:0 8px;}
.podium-item{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;}
.podium-base{border-radius:8px 8px 0 0;width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif Display',serif;font-size:20px;font-weight:700;}
.podium-base.gold{background:linear-gradient(135deg,#f1c40f33,#e67e2222);border:1px solid #f1c40f44;height:64px;color:#B7950B;}
.podium-base.silver{background:linear-gradient(135deg,#bdc3c733,#95a5a622);border:1px solid #bdc3c744;height:48px;color:#707B7C;}
.podium-base.bronze{background:linear-gradient(135deg,#e67e2233,#d3540022);border:1px solid #e67e2244;height:36px;color:#e67e22;}
.rank-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.rank-card.me{border-color:var(--gold);background:rgba(201,168,76,0.08);}
.rank-num{font-size:12px;font-weight:700;color:var(--muted);min-width:16px;text-align:center;}
.rank-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.rank-id{font-size:11px;color:var(--muted);white-space:nowrap;}
.rank-points{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap;margin-left:auto;padding-left:8px;}
.rank-header{background:transparent;border:none;padding:0 12px;margin-bottom:8px;}
.rank-header .rank-num,.rank-header .rank-name,.rank-header .rank-id,.rank-header .rank-points{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
.you-badge{background:rgba(201,168,76,0.2);color:var(--gold);font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;margin-left:6px;vertical-align:middle;}
.section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:12px;}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">🏆 Leaderboard</div>
    <div class="header-sub" id="header-sub">Mahjong SportBook</div>
  </div>
  <a href="javascript:history.back()" style="background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:6px;font-size:11px;text-decoration:none;">← Back</a>
</div>

<div class="main">
  <div class="club-selector" id="club-selector-wrap"></div>

  <div id="lb-loading" style="display:none;" class="loading"><div class="spinner"></div>Loading leaderboard...</div>

  <div id="lb-content" style="display:none;">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-number" id="stat-players">-</div><div class="stat-label">Players</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-top">-</div><div class="stat-label">Top Points</div></div>
    </div>
    <div id="podium-section"></div>
    <div class="section-label">All Players</div>
    <div class="rank-card rank-header">
      <div class="rank-num">Rank</div>
      <div class="rank-name">Name</div>
      <div class="rank-id">ID</div>
      <div class="rank-points">Points</div>
    </div>
    <div id="rest-section"></div>
  </div>

  <div id="lb-empty" class="empty-state" style="display:none;">
    <div class="empty-icon">🏆</div>
    <p>No confirmed games yet.<br/>Scores will appear here once players confirm results.</p>
  </div>
</div>

<script>
var SB_URL='https://jqqnnkzozjskziaizajg.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcW5ua3pvempza3ppYWl6YWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5Mjk1ODAsImV4cCI6MjA4ODUwNTU4MH0.sEYeWnm0dvuw8bLSVnQhqmgV8LB-pELjpuVIa3Us1Gg';
var player=null,myClubs=[],activeClubId='';

window.addEventListener('DOMContentLoaded',async function(){
  var saved=localStorage.getItem('sp_member');
  if(saved){
    player=JSON.parse(saved);
    document.getElementById('header-sub').textContent=player.name;
  } else {
    player={id:'',name:''};
    document.getElementById('header-sub').textContent='Public View';
  }
  await loadClubs();
});

async function sb(path){
  var res=await fetch(SB_URL+'/rest/v1/'+path,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  if(!res.ok){var e=await res.json();throw new Error(e.message);}
  return res.json();
}

async function loadClubs(){
  if(player.id){
    try{
      var mems=await sb('mj_members?player_id=eq.'+player.id+'&status=eq.approved&select=club_id');
      var ids=mems.map(function(m){return m.club_id;});
      if(ids.length){
        myClubs=await sb('mj_clubs?id=in.('+ids.join(',')+')'+'&status=eq.active&select=id,club_name');
      }
    }catch(e){}
  }
  if(!myClubs.length){
    myClubs=await sb('mj_clubs?status=eq.active&select=id,club_name');
  }
  var wrap=document.getElementById('club-selector-wrap');
  if(myClubs.length===1){
    // Only one club to show - a dropdown here would just be a single
    // option pretending to be a choice, so show it as a plain label
    // instead and skip selection entirely.
    activeClubId=myClubs[0].id;
    wrap.innerHTML='<label>Club</label><div style="font-size:15px;font-weight:600;color:var(--text);padding:4px 0;">🏯 '+myClubs[0].club_name+'</div>';
    loadLeaderboard();
  } else {
    wrap.innerHTML='<label>Select Club</label><select id="club-select" onchange="activeClubId=this.value;loadLeaderboard()"><option value="">Select a club...</option>'
      +myClubs.map(function(c){return '<option value="'+c.id+'">'+c.club_name+'</option>';}).join('')+'</select>';
  }
}

async function loadLeaderboard(){
  var clubId=activeClubId;
  if(!clubId)return;
  document.getElementById('lb-loading').style.display='block';
  document.getElementById('lb-content').style.display='none';
  document.getElementById('lb-empty').style.display='none';

  try{
    // One combined leaderboard - Traditional vs Taiwanese only decides
    // what a match's scores must sum to (140,000 or 2,040), not which
    // pool a player's rank points land in. Every confirmed game counts
    // toward the same total regardless of category.
    var rooms=await sb('mj_score_rooms?club_id=eq.'+clubId+'&status=eq.confirmed&select=id');
    var stats={};

    if(rooms.length){
      var roomIds=rooms.map(function(r){return r.id;});
      var entries=await sb('mj_score_entries?room_id=in.('+roomIds.join(',')+')'+'&select=player_id,rank_points');
      entries.forEach(function(e){
        if(!stats[e.player_id]){stats[e.player_id]={rankPoints:0,games:0};}
        stats[e.player_id].rankPoints+=(e.rank_points||0);
        stats[e.player_id].games+=1;
      });
    }

    // Add initial points - both columns count toward the same combined total
    var members=await sb('mj_members?club_id=eq.'+clubId+'&status=eq.approved&select=player_id,initial_points,initial_points_taiwanese,member_code');
    var codeMap={};members.forEach(function(m){codeMap[m.player_id]=m.member_code;});
    members.forEach(function(m){
      var pts=(m.initial_points||0)+(m.initial_points_taiwanese||0);
      if(pts>0){
        if(!stats[m.player_id]){stats[m.player_id]={rankPoints:0,games:0};}
        stats[m.player_id].rankPoints+=pts;
      }
    });

    if(!Object.keys(stats).length){
      document.getElementById('lb-loading').style.display='none';
      document.getElementById('lb-empty').style.display='block';
      return;
    }

    // Fetch names
    var allPids=Object.keys(stats);
    var players=await sb('sp_members?id=in.('+allPids.join(',')+')'+'&select=id,name');
    var pMap={};players.forEach(function(p){pMap[p.id]=p;});

    var allPlayers=allPids.map(function(pid){
      return {
        pid:pid,
        name:pMap[pid]?pMap[pid].name:'Unknown',
        code:codeMap[pid]||'—',
        rankPoints:stats[pid].rankPoints,
        games:stats[pid].games,
        isMe:pid===(player?player.id:'')
      };
    }).filter(function(p){return p.rankPoints>0;})
      .sort(function(a,b){return b.rankPoints-a.rankPoints;});

    if(!allPlayers.length){
      document.getElementById('lb-loading').style.display='none';
      document.getElementById('lb-empty').style.display='block';
      return;
    }

    var topPoints=allPlayers[0].rankPoints;
    document.getElementById('stat-players').textContent=allPlayers.length;
    document.getElementById('stat-top').textContent=topPoints;

    // Rank stage is a fixed 1st/2nd/3rd display, not tied to any specific
    // player - with a welcome-bonus tie across the whole club, singling
    // out named "winners" at the top would be arbitrary. The full list
    // below is what actually carries each player's name, code and points.
    document.getElementById('podium-section').innerHTML=
      '<div class="podium">'
      +'<div class="podium-item"><div class="podium-base silver">2</div></div>'
      +'<div class="podium-item"><div class="podium-base gold">1</div></div>'
      +'<div class="podium-item"><div class="podium-base bronze">3</div></div>'
      +'</div>';

    // Once real games differentiate points, each row's rank number is
    // its sorted position - left blank while everyone is still tied
    // (e.g. right after the welcome bonus), since numbering a pure tie
    // would imply a ranking that doesn't actually exist yet.
    var allTied=allPlayers.every(function(p){return p.rankPoints===allPlayers[0].rankPoints;});
    document.getElementById('rest-section').innerHTML=allPlayers.map(function(p,i){
      return '<div class="rank-card'+(p.isMe?' me':'')+'">'
        +'<div class="rank-num">'+(allTied?'':(i+1))+'</div>'
        +'<div class="rank-name">'+p.name+(p.isMe?'<span class="you-badge">YOU</span>':'')+'</div>'
        +'<div class="rank-id">'+p.code+'</div>'
        +'<div class="rank-points">'+p.rankPoints+' pts</div>'
        +'</div>';
    }).join('');

    document.getElementById('lb-loading').style.display='none';
    document.getElementById('lb-content').style.display='block';

  }catch(e){
    document.getElementById('lb-loading').style.display='none';
    document.getElementById('lb-empty').style.display='block';
  }
}
</script>
</body>
</html>
