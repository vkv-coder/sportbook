<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahjong — SportBook</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0f0e17" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0e17; --surface:#1a1930; --card:#22213a; --border:#2e2d4a;
  --gold:#c9a84c; --gold-light:#e8c97a; --red:#c0392b; --green:#27ae60;
  --blue:#2980b9; --text:#e8e6f0; --muted:#8b89a8; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-family:'Noto Serif Display',serif;font-size:18px;color:var(--gold);}
.header-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.btn-logout{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}
.nav-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);}
.nav-tab{flex:1;padding:12px 8px;border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;font-family:'Inter',sans-serif;}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.nav-tab .tab-icon{display:block;font-size:18px;margin-bottom:2px;}
.main{max-width:480px;margin:0 auto;padding:20px 16px 80px;}
.tab-content{display:none;}.tab-content.active{display:block;}
.date-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px;}
.date-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;}
.date-input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;outline:none;}
.date-input:focus{border-color:var(--gold);}
.btn-check{width:100%;padding:12px;border:none;border-radius:8px;background:var(--gold);color:#0f0e17;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;font-family:'Inter',sans-serif;}
.btn-check:hover{background:var(--gold-light);}
.club-avail-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.club-avail-header{padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
.club-avail-name{font-size:15px;font-weight:600;color:var(--gold-light);}
.club-avail-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.club-avail-body{padding:14px 16px;}
.slot-row{margin-bottom:12px;}
.slot-time{font-size:13px;font-weight:600;color:var(--gold);margin-bottom:8px;}
.tables-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.table-chip{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid;cursor:pointer;transition:all 0.2s;min-width:90px;text-align:center;}
.table-chip .seats{font-size:10px;font-weight:400;display:block;margin-top:2px;}
.chip-open{background:#1a3a1a;border-color:var(--green);color:#58d68d;}
.chip-open:hover{background:var(--green);color:#fff;}
.chip-filling{background:#3a2a1a;border-color:#e67e22;color:#f0b27a;}
.chip-filling:hover{background:#e67e22;color:#fff;}
.chip-full{background:#2a1a1a;border-color:#555;color:#777;cursor:not-allowed;}
.chip-mine{background:#1a2a3a;border-color:var(--blue);color:#5dade2;cursor:default;}
.chip-blocked{background:#2a1a2a;border-color:#666;color:#888;cursor:not-allowed;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.legend-dot{width:8px;height:8px;border-radius:50%;}
.dot-open{background:var(--green);}.dot-filling{background:#e67e22;}.dot-full{background:#555;}.dot-mine{background:var(--blue);}
.status-box{border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:12px;text-align:center;}
.status-success{background:#1a3a1a;border:1px solid var(--green);color:#58d68d;}
.status-error{background:#3a1a1a;border:1px solid var(--red);color:#f1948a;}
.status-info{background:#1a2a3a;border:1px solid var(--blue);color:#5dade2;}
.status-warn{background:#3a2a1a;border:1px solid #e67e22;color:#f0b27a;}
.discover-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.discover-name{font-size:15px;font-weight:600;color:var(--gold-light);margin-bottom:8px;}
.discover-meta{font-size:12px;color:var(--muted);margin-bottom:4px;}
.discover-meta span{color:var(--text);}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;text-transform:uppercase;}
.badge-mixed{background:#1a3a5c;color:#5dade2;}.badge-male{background:#1a2e1a;color:#58d68d;}.badge-female{background:#3a1a2e;color:#f1948a;}.badge-pending{background:#3a2a1a;color:#f0b27a;}
.booking-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.booking-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.booking-date{font-size:14px;font-weight:600;color:var(--gold-light);}
.booking-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;text-transform:uppercase;}
.badge-confirmed{background:#1a3a1a;color:#58d68d;}.badge-cancelled{background:#2a1a1a;color:#777;}
.booking-meta{font-size:12px;color:var(--muted);margin-bottom:3px;}
.booking-meta span{color:var(--text);}
.btn{padding:10px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;}
.btn-sm{padding:7px 14px;font-size:12px;}
.btn-gold{background:var(--gold);color:#0f0e17;}.btn-gold:hover{background:var(--gold-light);}
.btn-outline{background:transparent;border:1px solid var(--gold);color:var(--gold);}
.btn-red{background:var(--red);color:#fff;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.loading{text-align:center;padding:32px;color:var(--muted);font-size:13px;}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .empty-icon{font-size:40px;margin-bottom:12px;}
.empty-state p{font-size:13px;line-height:1.6;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:24px 20px;width:100%;max-width:480px;}
.modal-title{font-family:'Noto Serif Display',serif;font-size:18px;color:var(--gold);margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-actions .btn{flex:1;}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-title">🀄 Mahjong</div>
    <div class="header-sub" id="header-player-name">Loading...</div>
  </div>
  <button class="btn-logout" onclick="logout()">Logout</button>
</div>
<div class="nav-tabs">
  <button class="nav-tab active" onclick="switchTab('tab-availability')"><span class="tab-icon">🗓️</span>Find & Book</button>
  <button class="nav-tab" onclick="switchTab('tab-my-clubs')"><span class="tab-icon">🏯</span>My Clubs</button>
  <button class="nav-tab" onclick="switchTab('tab-bookings')"><span class="tab-icon">📋</span>My Bookings</button>
  <button class="nav-tab" onclick="switchTab('tab-discover')"><span class="tab-icon">🔍</span>Discover</button>
</div>
<div class="main">
  <div class="tab-content active" id="tab-availability">
    <div class="date-section">
      <div class="date-label">Select Date to Check Availability</div>
      <input type="date" class="date-input" id="avail-date" />
      <button class="btn-check" onclick="loadAvailability()">Check Availability →</button>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot dot-open"></div> Open</div>
      <div class="legend-item"><div class="legend-dot dot-filling"></div> Filling</div>
      <div class="legend-item"><div class="legend-dot dot-full"></div> Full</div>
      <div class="legend-item"><div class="legend-dot dot-mine"></div> My Booking</div>
    </div>
    <div id="avail-loading" style="display:none;" class="loading"><div class="spinner"></div>Checking clubs...</div>
    <div id="avail-results"></div>
  </div>
  <div class="tab-content" id="tab-my-clubs">
    <div id="my-clubs-loading" class="loading"><div class="spinner"></div>Loading your clubs...</div>
    <div id="my-clubs-list"></div>
  </div>
  <div class="tab-content" id="tab-bookings">
    <div id="bookings-loading" class="loading"><div class="spinner"></div>Loading bookings...</div>
    <div id="bookings-list"></div>
  </div>
  <div class="tab-content" id="tab-discover">
    <div id="discover-loading" class="loading"><div class="spinner"></div>Loading clubs...</div>
    <div id="discover-list"></div>
  </div>
</div>
<div class="modal-overlay" id="book-modal">
  <div class="modal">
    <div class="modal-title">Book a Seat</div>
    <div class="modal-sub" id="book-modal-sub"></div>
    <div id="book-modal-info"></div>
    <div id="book-modal-msg"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" id="book-confirm-btn" onclick="confirmBooking()">Confirm Seat</button>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL='https://jqqnnkzozjskziaizajg.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcW5ua3pvempza3ppYWl6YWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5Mjk1ODAsImV4cCI6MjA4ODUwNTU4MH0.sEYeWnm0dvuw8bLSVnQhqmgV8LB-pELjpuVIa3Us1Gg';
const TELEGRAM_BOT='8755990830:AAF4SBuKaGc4FXfjGqNdqVTOFCwk3vj8LYg';
const TELEGRAM_CHAT='8507770594';
let currentPlayer=null,myClubs=[],myClubIds=[],pendingBooking=null,allSlotsCache={};
window.addEventListener('DOMContentLoaded',async()=>{
  const saved=localStorage.getItem('mj_player');
  if(!saved){window.location.href='/select-game.html?role=player';return;}
  currentPlayer=JSON.parse(saved);
  document.getElementById('header-player-name').textContent=currentPlayer.name;
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('avail-date').value=today;
  document.getElementById('avail-date').min=today;
  await loadMyClubs();
  loadMyBookings();
  loadDiscover();
});
async function sb(path,method='GET',body=null){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{method,headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':''},body:body?JSON.stringify(body):null});
  if(!res.ok){const e=await res.json();throw new Error(e.message);}
  return method==='DELETE'?null:res.json();
}
async function sbPatch(path,body){
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`,{method:'PATCH',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
}
async function sendTelegram(msg){
  try{await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TELEGRAM_CHAT,text:msg,parse_mode:'HTML'})});}catch(e){}
}
function switchTab(tabId){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  const idx=['tab-availability','tab-my-clubs','tab-bookings','tab-discover'].indexOf(tabId);
  document.querySelectorAll('.nav-tab')[idx].classList.add('active');
}
async function loadMyClubs(){
  document.getElementById('my-clubs-loading').style.display='block';
  document.getElementById('my-clubs-list').innerHTML='';
  try{
    const memberships=await sb(`mj_members?player_id=eq.${currentPlayer.id}&status=eq.approved&select=club_id`);
    myClubIds=memberships.map(m=>m.club_id);
    if(!myClubIds.length){
      document.getElementById('my-clubs-loading').style.display='none';
      document.getElementById('my-clubs-list').innerHTML='<div class="empty-state"><div class="empty-icon">🏯</div><p>You are not a member of any club yet.<br/>Go to Discover tab to find and join a club.</p></div>';
      return;
    }
    myClubs=await sb(`mj_clubs?id=in.(${myClubIds.join(',')})&status=eq.active&select=*&order=club_name.asc`);
    for(const club of myClubs){
      const slots=await sb(`mj_slots?club_id=eq.${club.id}&is_active=eq.true&select=*&order=start_time.asc`);
      allSlotsCache[club.id]=slots;
    }
    document.getElementById('my-clubs-loading').style.display='none';
    const gLabel=g=>g==='male'?'👨 Male Only':g==='female'?'👩 Female Only':'👥 Mixed';
    document.getElementById('my-clubs-list').innerHTML=myClubs.map(club=>`
      <div class="discover-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
          <div class="discover-name">🏯 ${club.club_name}</div>
          <span class="badge ${club.gender_condition==='male'?'badge-male':club.gender_condition==='female'?'badge-female':'badge-mixed'}">${gLabel(club.gender_condition)}</span>
        </div>
        <div class="discover-meta">📍 <span>${club.city||'N/A'}</span></div>
        <div class="discover-meta">🀄 Tables: <span>${club.total_tables}</span></div>
        <div class="discover-meta">📞 WhatsApp: <span>${club.whatsapp_no||'N/A'}</span></div>
        <div style="margin-top:10px;"><span style="font-size:12px;background:#1a3a1a;color:#58d68d;padding:4px 10px;border-radius:20px;font-weight:600;">✓ Approved Member</span></div>
      </div>`).join('');
  }catch(e){document.getElementById('my-clubs-loading').style.display='none';document.getElementById('my-clubs-list').innerHTML=`<div class="status-box status-error">Error: ${e.message}</div>`;}
}
async function loadAvailability(){
  const date=document.getElementById('avail-date').value;
  if(!date){alert('Please select a date.');return;}
  if(!myClubIds.length){
    document.getElementById('avail-results').innerHTML='<div class="empty-state"><div class="empty-icon">🏯</div><p>You are not a member of any club yet.<br/>Go to Discover tab to join a club first.</p></div>';
    return;
  }
  document.getElementById('avail-loading').style.display='block';
  document.getElementById('avail-results').innerHTML='';
  try{
    const d=new Date(date+'T00:00:00');
    const dayNames=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    const dayName=dayNames[d.getDay()];
    const myBookingsToday=await sb(`mj_bookings?player_id=eq.${currentPlayer.id}&booking_date=eq.${date}&status=eq.confirmed&select=slot_id`);
    const myBookedSlotIds=myBookingsToday.map(b=>b.slot_id);
    let html='';
    for(const club of myClubs){
      const slots=allSlotsCache[club.id]||[];
      const daySlots=slots.filter(s=>{
        if(!s.day_of_week||s.day_of_week==='all')return true;
        return s.day_of_week.toLowerCase()===dayName;
      });
      if(!daySlots.length)continue;
      const bookings=await sb(`mj_bookings?club_id=eq.${club.id}&booking_date=eq.${date}&status=eq.confirmed&select=*`);
      let slotsHtml='';
      for(const slot of daySlots){
        const slotBookings=bookings.filter(b=>b.slot_id===slot.id);
        const isSlotBookedByMe=myBookedSlotIds.includes(slot.id);
        let tablesHtml='';
        for(let t=1;t<=club.total_tables;t++){
          const tableBookings=slotBookings.filter(b=>b.table_number===t);
          const count=tableBookings.length;
          const isMine=tableBookings.some(b=>b.player_id===currentPlayer.id);
          let chipClass='chip-open',seatLabel=`${count}/4 seats`,clickable=true;
          if(isMine){chipClass='chip-mine';seatLabel='✓ My Seat';clickable=false;}
          else if(count>=4){chipClass='chip-full';seatLabel='Full';clickable=false;}
          else if(isSlotBookedByMe&&!isMine){chipClass='chip-blocked';seatLabel='Slot taken';clickable=false;}
          else if(count>0){chipClass='chip-filling';}
          const onclick=clickable?`openBookModal('${club.id}','${club.club_name.replace(/'/g,"\\'")}','${slot.id}',${t},${count},'${slot.start_time}–${slot.end_time}','${date}')`:'';
          tablesHtml+=`<div class="table-chip ${chipClass}" ${onclick?`onclick="${onclick}"`:''}> Table ${t}<span class="seats">${seatLabel}</span></div>`;
        }
        slotsHtml+=`<div class="slot-row"><div class="slot-time">🕐 ${slot.start_time} – ${slot.end_time}</div><div class="tables-wrap">${tablesHtml}</div></div>`;
      }
      if(slotsHtml){html+=`<div class="club-avail-card"><div class="club-avail-header"><div class="club-avail-name">🏯 ${club.club_name}</div><div class="club-avail-meta">📍 ${club.city||''} · ${club.total_tables} tables</div></div><div class="club-avail-body">${slotsHtml}</div></div>`;}
    }
    document.getElementById('avail-loading').style.display='none';
    document.getElementById('avail-results').innerHTML=html||'<div class="empty-state"><div class="empty-icon">🚫</div><p>No slots available across your clubs on this day.</p></div>';
  }catch(e){document.getElementById('avail-loading').style.display='none';document.getElementById('avail-results').innerHTML=`<div class="status-box status-error">Error: ${e.message}</div>`;}
}
function openBookModal(clubId,clubName,slotId,tableNo,currentCount,timeLabel,date){
  pendingBooking={clubId,clubName,slotId,tableNo,currentCount,timeLabel,date};
  document.getElementById('book-modal-sub').textContent=`${clubName} · Table ${tableNo} · ${timeLabel} · ${date}`;
  document.getElementById('book-modal-info').innerHTML=`<div class="status-box status-info">${currentCount} of 4 seats taken. ${4-currentCount} seat(s) available.<br/>You will take 1 seat.</div>`;
  document.getElementById('book-modal-msg').innerHTML='';
  document.getElementById('book-confirm-btn').disabled=false;
  document.getElementById('book-confirm-btn').textContent='Confirm Seat';
  document.getElementById('book-modal').classList.add('open');
}
function closeModal(){document.getElementById('book-modal').classList.remove('open');pendingBooking=null;}
async function confirmBooking(){
  if(!pendingBooking)return;
  const btn=document.getElementById('book-confirm-btn');
  btn.disabled=true;btn.textContent='Booking...';
  try{
    const{clubId,clubName,slotId,tableNo,date,timeLabel}=pendingBooking;
    const fresh=await sb(`mj_bookings?club_id=eq.${clubId}&slot_id=eq.${slotId}&table_number=eq.${tableNo}&booking_date=eq.${date}&status=eq.confirmed&select=id,player_id`);
    if(fresh.length>=4){document.getElementById('book-modal-msg').innerHTML='<div class="status-box status-error">Table just got full! Please choose another.</div>';btn.disabled=false;btn.textContent='Confirm Seat';return;}
    const crossCheck=await sb(`mj_bookings?player_id=eq.${currentPlayer.id}&slot_id=eq.${slotId}&booking_date=eq.${date}&status=eq.confirmed&select=id`);
    if(crossCheck.length>0){document.getElementById('book-modal-msg').innerHTML='<div class="status-box status-warn">You already have a booking in this time slot at another club.</div>';btn.disabled=false;btn.textContent='Confirm Seat';return;}
    await sb('mj_bookings','POST',{club_id:clubId,slot_id:slotId,table_number:tableNo,player_id:currentPlayer.id,booking_date:date,status:'confirmed'});
    const newCount=fresh.length+1;
    const sessions=await sb(`mj_table_sessions?club_id=eq.${clubId}&slot_id=eq.${slotId}&table_number=eq.${tableNo}&booking_date=eq.${date}&select=*`);
    const allPlayerIds=[...fresh.map(b=>b.player_id),currentPlayer.id];
    const sessionData={player1_id:allPlayerIds[0]||null,player2_id:allPlayerIds[1]||null,player3_id:allPlayerIds[2]||null,player4_id:allPlayerIds[3]||null,status:newCount>=4?'full':'filling'};
    if(sessions.length>0){await sbPatch(`mj_table_sessions?id=eq.${sessions[0].id}`,sessionData);}
    else{await sb('mj_table_sessions','POST',{club_id:clubId,slot_id:slotId,table_number:tableNo,booking_date:date,...sessionData});}
    if(newCount>=4){await sendTelegram(`🀄 <b>TABLE FULL — Action Required</b>\n\nClub: <b>${clubName}</b>\nTable: <b>${tableNo}</b>\nDate: <b>${date}</b>\nTime: <b>${timeLabel}</b>\n\nAll 4 seats booked. Please notify members from your Club Dashboard.`);}
    document.getElementById('book-modal-msg').innerHTML=`<div class="status-box status-success">✅ Seat confirmed!${newCount>=4?' Table is FULL — club admin notified.':''}</div>`;
    btn.textContent='✓ Booked!';
    setTimeout(()=>{closeModal();loadAvailability();loadMyBookings();},1800);
  }catch(e){document.getElementById('book-modal-msg').innerHTML=`<div class="status-box status-error">Error: ${e.message}</div>`;btn.disabled=false;btn.textContent='Confirm Seat';}
}
async function loadMyBookings(){
  document.getElementById('bookings-loading').style.display='block';
  document.getElementById('bookings-list').innerHTML='';
  try{
    const bookings=await sb(`mj_bookings?player_id=eq.${currentPlayer.id}&select=*&order=booking_date.desc,created_at.desc`);
    document.getElementById('bookings-loading').style.display='none';
    if(!bookings.length){document.getElementById('bookings-list').innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><p>No bookings yet.<br/>Go to Find & Book tab!</p></div>';return;}
    const clubIds=[...new Set(bookings.map(b=>b.club_id))];
    const slotIds=[...new Set(bookings.map(b=>b.slot_id))];
    const[clubs,slots]=await Promise.all([
      clubIds.length?sb(`mj_clubs?id=in.(${clubIds.join(',')})&select=id,club_name`):Promise.resolve([]),
      slotIds.length?sb(`mj_slots?id=in.(${slotIds.join(',')})&select=id,start_time,end_time`):Promise.resolve([])
    ]);
    const clubMap={};clubs.forEach(c=>{clubMap[c.id]=c;});
    const slotMap={};slots.forEach(s=>{slotMap[s.id]=s;});
    document.getElementById('bookings-list').innerHTML=bookings.map(b=>{
      const club=clubMap[b.club_id];const slot=slotMap[b.slot_id];
      const slotLabel=slot?`${slot.start_time} – ${slot.end_time}`:'—';
      return`<div class="booking-item"><div class="booking-header"><div class="booking-date">📅 ${b.booking_date}</div><span class="booking-badge ${b.status==='confirmed'?'badge-confirmed':'badge-cancelled'}">${b.status}</span></div><div class="booking-meta">🏯 Club: <span>${club?.club_name||'—'}</span></div><div class="booking-meta">🀄 Table: <span>${b.table_number}</span></div><div class="booking-meta">🕐 Time: <span>${slotLabel}</span></div>${b.status==='confirmed'?`<div style="margin-top:10px;"><button class="btn btn-sm btn-red" onclick="cancelBooking('${b.id}','${b.slot_id}',${b.table_number},'${b.booking_date}','${b.club_id}')">Cancel</button></div>`:''}</div>`;
    }).join('');
  }catch(e){document.getElementById('bookings-loading').style.display='none';document.getElementById('bookings-list').innerHTML=`<div class="status-box status-error">Error: ${e.message}</div>`;}
}
async function cancelBooking(bookingId,slotId,tableNo,date,clubId){
  if(!confirm('Cancel this booking?'))return;
  try{
    await sbPatch(`mj_bookings?id=eq.${bookingId}`,{status:'cancelled'});
    await sbPatch(`mj_table_sessions?club_id=eq.${clubId}&slot_id=eq.${slotId}&table_number=eq.${tableNo}&booking_date=eq.${date}`,{status:'filling'});
    loadMyBookings();loadAvailability();
  }catch(e){alert('Error: '+e.message);}
}
async function loadDiscover(){
  document.getElementById('discover-loading').style.display='block';
  document.getElementById('discover-list').innerHTML='';
  try{
    const allClubs=await sb('mj_clubs?status=eq.active&select=*&order=club_name.asc');
    const memberships=await sb(`mj_members?player_id=eq.${currentPlayer.id}&select=club_id,status`);
    const memberMap={};memberships.forEach(m=>{memberMap[m.club_id]=m.status;});
    document.getElementById('discover-loading').style.display='none';
    const nonMemberClubs=allClubs.filter(c=>!memberMap[c.id]||memberMap[c.id]==='rejected');
    if(!nonMemberClubs.length){document.getElementById('discover-list').innerHTML='<div class="empty-state"><div class="empty-icon">🎉</div><p>You are a member of all available clubs!</p></div>';return;}
    const gLabel=g=>g==='male'?'👨 Male Only':g==='female'?'👩 Female Only':'👥 Mixed';
    document.getElementById('discover-list').innerHTML=nonMemberClubs.map(club=>{
      const status=memberMap[club.id];
      const actionBtn=status==='pending'?`<span class="badge badge-pending">⏳ Request Pending</span>`:`<button class="btn btn-outline btn-sm" onclick="requestMembership('${club.id}','${club.club_name.replace(/'/g,"\\'")}',this)">Request to Join</button>`;
      return`<div class="discover-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;"><div class="discover-name">🏯 ${club.club_name}</div><span class="badge ${club.gender_condition==='male'?'badge-male':club.gender_condition==='female'?'badge-female':'badge-mixed'}">${gLabel(club.gender_condition)}</span></div><div class="discover-meta">📍 <span>${club.city||'N/A'}</span></div><div class="discover-meta">🀄 Tables: <span>${club.total_tables}</span></div><div style="margin-top:12px;">${actionBtn}</div></div>`;
    }).join('');
  }catch(e){document.getElementById('discover-loading').style.display='none';document.getElementById('discover-list').innerHTML=`<div class="status-box status-error">Error: ${e.message}</div>`;}
}
async function requestMembership(clubId,clubName,btn){
  btn.disabled=true;btn.textContent='Sending...';
  try{
    const existing=await sb(`mj_members?player_id=eq.${currentPlayer.id}&club_id=eq.${clubId}&select=id`);
    if(existing.length>0){btn.disabled=false;btn.textContent='Request to Join';return;}
    await sb('mj_members','POST',{club_id:clubId,player_id:currentPlayer.id,status:'pending'});
    await sendTelegram(`🀄 <b>New Membership Request</b>\n\nClub: <b>${clubName}</b>\nPlayer: <b>${currentPlayer.name}</b>\nMobile: ${currentPlayer.mobile}\nEmail: ${currentPlayer.email}\nGender: ${currentPlayer.gender}\n\nApprove from Club Admin Dashboard.`);
    btn.outerHTML=`<span class="badge badge-pending">⏳ Request Pending</span>`;
  }catch(e){btn.disabled=false;btn.textContent='Request to Join';alert('Error: '+e.message);}
}
function logout(){localStorage.removeItem('mj_player');localStorage.removeItem('mj_active_club');window.location.href='/select-game.html?role=player';}
</script>
